name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # push built site to gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci --no-audit --no-fund
      - run: npm run build   # vite build + prerender into dist/

      # Publish dist/ to the gh-pages branch; Pages serves from that branch.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: next-wiki.hugogu.cn
          user_name: Hugo Gu
          user_email: hugogu@outlook.com
          commit_message: "deploy: ${{ github.sha }}"
