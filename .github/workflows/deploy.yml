name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, portal]
    env:
      CHROME_BIN: /home/hugo/.cache/ms-playwright/chromium-1228/chrome-linux64/chrome
    steps:
      - uses: actions/checkout@v4


      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest  # deploy must reach GitHub Pages backend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000        # 10 min: Pages backend can queue large sites
          error_count: 10        # tolerate transient polling errors
          reporting_interval: 15000
