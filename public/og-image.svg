<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">next-wiki — AI-Assisted Personal Knowledge Base</title>
  <desc id="desc">An AI-assisted personal knowledge base for people who run multiple AI Agents.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617" />
      <stop offset="0.58" stop-color="#062d3c" />
      <stop offset="1" stop-color="#172554" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#67e8f9" stroke-opacity="0.1" />
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="1030" cy="500" r="190" fill="#2563eb" fill-opacity="0.2" filter="url(#glow)" />
  <circle cx="780" cy="70" r="150" fill="#06b6d4" fill-opacity="0.12" filter="url(#glow)" />

  <rect x="90" y="72" width="58" height="58" rx="14" fill="#22d3ee" />
  <text x="119" y="111" text-anchor="middle" fill="#082f49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700">&gt;_</text>
  <text x="166" y="113" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="40" font-weight="600">next-wiki</text>

  <rect x="90" y="166" width="704" height="44" rx="22" fill="#020617" fill-opacity="0.35" stroke="#22d3ee" stroke-width="2" />
  <text x="112" y="196" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">Open Source · Self-hosted · AI-assisted Knowledge Base</text>

  <text x="90" y="306" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="750">Your personal</text>
  <text x="90" y="390" fill="#22d3ee" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="750">knowledge base</text>
  <text x="90" y="474" fill="#22d3ee" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="750">for every Agent you run</text>

  <text x="90" y="535" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="25">Capture knowledge once. Give each Agent only the context you allow.</text>
  <text x="90" y="584" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">next-wiki.hugogu.cn</text>
  <text x="390" y="584" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22">by Hugo Gu</text>
</svg>
